[package]
name = "leptos-kanban"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
leptos = { version = "0.8.17", features = ["csr"] }
leptos-use = "0.18.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting", "macros", "serde-human-readable"] }
uuid = { version = "1.23.1", features = ["v4", "js", "serde"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Performance", "PerformanceEntry", "Window", "console"] }
